<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Plan taktyczny · Optimist</title>
<meta name="theme-color" content="#EDE7DA">
<link rel="manifest" href='data:application/json,{"name":"Taktyka Optimist","short_name":"Taktyka","display":"standalone","background_color":"%23EDE7DA","theme_color":"%23EDE7DA","start_url":"."}'>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.26.4/babel.min.js"></script>
<style>html,body{margin:0;padding:0}</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useMemo, useState, useRef } = React;

/* ---------- geometry helpers ---------- */
const D2R = Math.PI / 180;
const norm360 = (a) => ((a % 360) + 360) % 360;
const sdiff = (a, b) => ((a - b + 540) % 360) - 180; // signed diff a-b in (-180,180]

function toXY(lat, lon, ref) {
  const x = (lon - ref.lon) * Math.cos(ref.lat * D2R) * 111320;
  const y = (lat - ref.lat) * 110540;
  return { x, y };
}
const bearing = (a, b) => norm360(Math.atan2(b.x - a.x, b.y - a.y) / D2R);
const dist = (a, b) => Math.hypot(b.x - a.x, b.y - a.y);
function circMean(angles) {
  let sx = 0, sy = 0;
  angles.forEach((a) => { sx += Math.sin(a * D2R); sy += Math.cos(a * D2R); });
  return norm360(Math.atan2(sx, sy) / D2R);
}
const parseNum = (s) => {
  if (s === "" || s == null) return NaN;
  const v = parseFloat(String(s).replace(",", "."));
  return Number.isFinite(v) ? v : NaN;
};

/* ---------- demo data (Zatoka Pucka) ---------- */
const DEMO = {
  rc:   { lat: "54.7010", lon: "18.5230", wind: "312", spd: "9" },
  pin:  { lat: "54.7002", lon: "18.5205", wind: "306", spd: "8" },
  mark: { lat: "54.7052", lon: "18.5195", wind: "318", spd: "11" },
};
const EMPTY = {
  rc:   { lat: "", lon: "", wind: "", spd: "" },
  pin:  { lat: "", lon: "", wind: "", spd: "" },
  mark: { lat: "", lon: "", wind: "", spd: "" },
};

/* ---------- palette (chart aesthetic) ---------- */
const C = {
  paper: "#EDE7DA",
  water: "#D8E9EE",
  waterDeep: "#C4DDE5",
  ink: "#17313F",
  inkSoft: "#4A6675",
  magenta: "#AE2E7C",
  orange: "#E2641C",
  green: "#1E7A4F",
  line: "#8FB0BC",
};

function TaktykaRegatowa() {
  const [pts, setPts] = useState(EMPTY);
  const [tackAngle, setTackAngle] = useState(45);
  const [gps, setGps] = useState({}); // per-station status: {state, msg}
  const [wx, setWx] = useState({});   // per-station wind fetch status

  const fetchWind = async (station) => {
    const lat = parseNum(pts[station].lat), lon = parseNum(pts[station].lon);
    if (!Number.isFinite(lat) || !Number.isFinite(lon)) {
      setWx((w) => ({ ...w, [station]: { state: "err", msg: "Najpierw pobierz lub wpisz współrzędne" } }));
      return;
    }
    setWx((w) => ({ ...w, [station]: { state: "busy", msg: "Pobieram wiatr…" } }));
    try {
      const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}` +
        `&current=wind_speed_10m,wind_direction_10m,wind_gusts_10m&wind_speed_unit=kn`;
      const res = await fetch(url);
      if (!res.ok) throw new Error("HTTP " + res.status);
      const data = await res.json();
      const dir = Math.round(data?.current?.wind_direction_10m);
      const spd = data?.current?.wind_speed_10m;
      const gust = data?.current?.wind_gusts_10m;
      if (!Number.isFinite(dir)) throw new Error("brak danych");
      setPts((p) => ({
        ...p,
        [station]: { ...p[station], wind: String(dir), spd: Number.isFinite(spd) ? spd.toFixed(1) : p[station].spd },
      }));
      setWx((w) => ({ ...w, [station]: { state: "ok", msg: `Model: ${dir}° · ${spd?.toFixed(0)} kn${Number.isFinite(gust) ? ` (szkwały ${gust.toFixed(0)} kn)` : ""}` } }));
    } catch (e) {
      setWx((w) => ({ ...w, [station]: { state: "err", msg: "Nie udało się pobrać — wpisz ręcznie z wiatromierza" } }));
    }
  };

  const set = (station, field, value) =>
    setPts((p) => ({ ...p, [station]: { ...p[station], [field]: value } }));

  const grabGPS = (station) => {
    if (!("geolocation" in navigator)) {
      setGps((g) => ({ ...g, [station]: { state: "err", msg: "Brak GPS w tej przeglądarce" } }));
      return;
    }
    setGps((g) => ({ ...g, [station]: { state: "busy", msg: "Pobieram pozycję…" } }));
    navigator.geolocation.getCurrentPosition(
      (pos) => {
        const { latitude, longitude, accuracy } = pos.coords;
        setPts((p) => ({
          ...p,
          [station]: { ...p[station], lat: latitude.toFixed(6), lon: longitude.toFixed(6) },
        }));
        setGps((g) => ({ ...g, [station]: { state: "ok", msg: `Zapisano · ±${Math.round(accuracy)} m` } }));
      },
      (err) => {
        const msg =
          err.code === 1 ? "Brak zgody na lokalizację — sprawdź uprawnienia przeglądarki"
          : err.code === 3 ? "Przekroczono czas — spróbuj ponownie"
          : "Nie udało się pobrać pozycji";
        setGps((g) => ({ ...g, [station]: { state: "err", msg } }));
      },
      { enableHighAccuracy: true, timeout: 12000, maximumAge: 0 }
    );
  };

  const model = useMemo(() => {
    const raw = {};
    for (const k of ["rc", "pin", "mark"]) {
      raw[k] = {
        lat: parseNum(pts[k].lat),
        lon: parseNum(pts[k].lon),
        wind: parseNum(pts[k].wind),
      };
      if (![raw[k].lat, raw[k].lon, raw[k].wind].every(Number.isFinite)) return null;
      raw[k].wind = norm360(raw[k].wind);
      raw[k].spd = parseNum(pts[k].spd); // optional
    }
    const ref = { lat: raw.pin.lat, lon: raw.pin.lon };
    const P = toXY(raw.pin.lat, raw.pin.lon, ref);
    const R = toXY(raw.rc.lat, raw.rc.lon, ref);
    const M = toXY(raw.mark.lat, raw.mark.lon, ref);
    if (dist(P, R) < 5) return null;

    const lineBrg = bearing(P, R);           // pin -> RC
    const lineLen = dist(P, R);
    const wLine = circMean([raw.pin.wind, raw.rc.wind]);
    const wAll = circMean([raw.pin.wind, raw.rc.wind, raw.mark.wind]);

    // perpendicular of the line pointing upwind
    const cand = [norm360(lineBrg + 90), norm360(lineBrg - 90)];
    const perpUp = Math.abs(sdiff(wLine, cand[0])) <= Math.abs(sdiff(wLine, cand[1])) ? cand[0] : cand[1];
    const bias = sdiff(wLine, perpUp); // + => wind veered right of square
    const rcIsRightEnd = Math.abs(sdiff(lineBrg, norm360(perpUp + 90))) < 90;
    let favored = "even";
    if (Math.abs(bias) >= 3) favored = bias > 0 ? (rcIsRightEnd ? "rc" : "pin") : (rcIsRightEnd ? "pin" : "rc");

    const mid = { x: (P.x + R.x) / 2, y: (P.y + R.y) / 2 };
    const beatBrg = bearing(mid, M);
    const beatLen = dist(mid, M);
    const skew = sdiff(beatBrg, wAll); // + => mark right of wind axis => port tack longer

    const shift = sdiff(raw.mark.wind, wLine); // expected shift up the beat
    let side = "neutral";
    if (shift >= 5) side = "right";
    else if (shift <= -5) side = "left";
    else if (Math.abs(skew) >= 8) side = skew > 0 ? "right" : "left";

    return { raw, P, R, M, mid, lineBrg, lineLen, wLine, wAll, perpUp, bias, favored, beatBrg, beatLen, skew, shift, side };
  }, [pts]);

  return (
    <div style={{ minHeight: "100vh", background: C.paper, color: C.ink, fontFamily: "'IBM Plex Mono', ui-monospace, Menlo, monospace" }}>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');
        input:focus { outline: 2px solid ${C.magenta}; outline-offset: 1px; }
        @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
      `}</style>

      {/* title block, like a chart cartouche */}
      <header style={{ borderBottom: `3px double ${C.ink}`, padding: "18px 20px 12px", display: "flex", flexWrap: "wrap", alignItems: "baseline", gap: 12 }}>
        <h1 style={{ fontFamily: "'Barlow Condensed', sans-serif", fontWeight: 700, fontSize: 34, letterSpacing: 1, margin: 0, textTransform: "uppercase" }}>
          Plan taktyczny · Optimist
        </h1>
        <span style={{ fontSize: 12, color: C.inkSoft }}>linia startu · pierwszy beat · boja 1</span>
        <button
          onClick={() => setPts(DEMO)}
          style={{ marginLeft: "auto", fontFamily: "inherit", fontSize: 12, padding: "6px 12px", border: `1.5px solid ${C.ink}`, background: "transparent", color: C.ink, cursor: "pointer" }}
        >
          Wczytaj przykład
        </button>
      </header>

      <main style={{ display: "grid", gridTemplateColumns: "minmax(280px, 340px) 1fr", gap: 0, alignItems: "stretch" }}
            className="layout">
        <style>{`
          @media (max-width: 820px) { .layout { grid-template-columns: 1fr !important; } }
        `}</style>

        {/* -------- inputs -------- */}
        <section style={{ borderRight: `1.5px solid ${C.ink}`, padding: 20, display: "flex", flexDirection: "column", gap: 18 }}>
          {[
            { key: "rc", label: "Komisja regatowa (RC)", tint: C.ink },
            { key: "pin", label: "Pin (lewy koniec linii)", tint: C.magenta },
            { key: "mark", label: "Boja nr 1", tint: C.orange },
          ].map(({ key, label, tint }) => (
            <fieldset key={key} style={{ border: `1.5px solid ${C.ink}`, padding: "12px 14px 14px", margin: 0 }}>
              <legend style={{ fontFamily: "'Barlow Condensed', sans-serif", fontWeight: 600, fontSize: 17, textTransform: "uppercase", letterSpacing: 0.5, padding: "0 6px", color: tint }}>
                {label}
              </legend>
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8 }}>
                <Field label="Szer. (lat)" value={pts[key].lat} onChange={(v) => set(key, "lat", v)} placeholder="54.7010" />
                <Field label="Dł. (lon)" value={pts[key].lon} onChange={(v) => set(key, "lon", v)} placeholder="18.5230" />
                <Field label="Kierunek wiatru [°]" value={pts[key].wind} onChange={(v) => set(key, "wind", v)} placeholder="310" />
                <Field label="Siła wiatru [kn]" value={pts[key].spd} onChange={(v) => set(key, "spd", v)} placeholder="9" />
                <button
                  onClick={() => grabGPS(key)}
                  disabled={gps[key]?.state === "busy"}
                  style={{
                    gridColumn: "1 / -1", fontFamily: "inherit", fontSize: 13, fontWeight: 600,
                    padding: "9px 10px", border: `1.5px solid ${tint}`, cursor: "pointer",
                    background: gps[key]?.state === "busy" ? "#E5E0D2" : tint, color: gps[key]?.state === "busy" ? C.inkSoft : "#FBF9F3",
                  }}
                >
                  {gps[key]?.state === "busy" ? "Pobieram…" : "◉ Jestem tutaj — pobierz z GPS"}
                </button>
                {gps[key]?.msg && (
                  <span style={{ gridColumn: "1 / -1", fontSize: 11, color: gps[key].state === "err" ? "#A3342C" : C.green }}>
                    {gps[key].msg}
                  </span>
                )}
                <button
                  onClick={() => fetchWind(key)}
                  disabled={wx[key]?.state === "busy"}
                  style={{
                    gridColumn: "1 / -1", fontFamily: "inherit", fontSize: 13, fontWeight: 600,
                    padding: "9px 10px", border: `1.5px solid ${tint}`, cursor: "pointer",
                    background: "transparent", color: tint,
                  }}
                >
                  {wx[key]?.state === "busy" ? "Pobieram…" : "≋ Wiatr automatycznie (model)"}
                </button>
                {wx[key]?.msg && (
                  <span style={{ gridColumn: "1 / -1", fontSize: 11, color: wx[key].state === "err" ? "#A3342C" : C.green }}>
                    {wx[key].msg}
                  </span>
                )}
              </div>
            </fieldset>
          ))}

          <label style={{ fontSize: 12, display: "flex", flexDirection: "column", gap: 6 }}>
            <span>Kąt halsowania (do wiatru): <b>{tackAngle}°</b></span>
            <input type="range" min={40} max={55} value={tackAngle} onChange={(e) => setTackAngle(+e.target.value)} style={{ accentColor: C.magenta }} />
          </label>

          <BleAnemometer
            onSave={(station, dir, spd) =>
              setPts((p) => ({ ...p, [station]: { ...p[station], wind: String(dir), spd: spd.toFixed(1) } }))
            }
          />
        </section>

        {/* -------- chart + verdict -------- */}
        <section style={{ padding: 20, display: "flex", flexDirection: "column", gap: 16 }}>
          {model ? (
            <>
              <Chart m={model} tackAngle={tackAngle} />
              <Verdict m={model} />
            </>
          ) : (
            <div style={{ border: `1.5px dashed ${C.inkSoft}`, padding: 40, textAlign: "center", color: C.inkSoft, fontSize: 13, lineHeight: 1.7 }}>
              Wpisz współrzędne (stopnie dziesiętne) i kierunki wiatru<br />
              dla komisji, pinu i boi nr 1 — albo wczytaj przykład.
            </div>
          )}
        </section>
      </main>

      <footer style={{ padding: "10px 20px 18px", fontSize: 11, color: C.inkSoft, borderTop: `1.5px solid ${C.line}` }}>
        Narzędzie pomocnicze — decyzje na wodzie zawsze weryfikuj obserwacją wiatru i floty. Kierunki: skąd wieje, ° magnetyczne lub rzeczywiste — byle spójnie.
      </footer>
    </div>
  );
}

function Field({ label, value, onChange, placeholder }) {
  return (
    <label style={{ display: "flex", flexDirection: "column", gap: 3, fontSize: 11, color: C.inkSoft }}>
      {label}
      <input
        value={value}
        onChange={(e) => onChange(e.target.value)}
        placeholder={placeholder}
        inputMode="decimal"
        style={{ fontFamily: "inherit", fontSize: 14, padding: "7px 8px", border: `1.5px solid ${C.ink}`, background: "#FBF9F3", color: C.ink }}
      />
    </label>
  );
}

/* ---------- verdict panel ---------- */
function Verdict({ m }) {
  const endName = { rc: "przy KOMISJI", pin: "przy PINIE", even: "dowolny — linia wyrównana" }[m.favored];
  const biasTxt = m.favored === "even" ? `bias ${Math.abs(m.bias).toFixed(0)}° (pomijalny)` : `bias ${Math.abs(m.bias).toFixed(0)}°`;

  const sideTxt = {
    right: "PRAWA strona trasy",
    left: "LEWA strona trasy",
    neutral: "środek / bez wyraźnej przewagi",
  }[m.side];

  const sideWhy =
    m.side === "right"
      ? `wiatr przy boi odchodzi w prawo o ${Math.abs(m.shift).toFixed(0)}° względem linii`
      : m.side === "left"
      ? `wiatr przy boi odchodzi w lewo o ${Math.abs(m.shift).toFixed(0)}° względem linii`
      : `różnica wiatru linia→boja tylko ${Math.abs(m.shift).toFixed(0)}°`;

  let tackTxt, tackWhy;
  if (m.side === "right") {
    tackTxt = "start na prawym halsie, wcześnie zwrot na lewy hals";
    tackWhy = "lewy hals prowadzi w prawą stronę trasy — nie daj się zablokować grupie";
  } else if (m.side === "left") {
    tackTxt = "prawy hals i trzymaj go";
    tackWhy = "prawy hals prowadzi w lewą stronę trasy; masz też prawo drogi";
  } else {
    tackTxt = Math.abs(m.skew) >= 5 ? (m.skew > 0 ? "dłuższy hals: lewy — zacznij od niego po czystym starcie" : "dłuższy hals: prawy — trzymaj go dłużej") : "płyń dłuższym halsem, graj zmianami";
    tackWhy = `skos trasy ${m.skew > 0 ? "+" : ""}${m.skew.toFixed(0)}° względem wiatru`;
  }

  const rows = [
    { k: "START", v: endName, sub: `${biasTxt} · linia ${m.lineLen.toFixed(0)} m · kurs linii ${m.lineBrg.toFixed(0)}°` },
    { k: "STRONA", v: sideTxt, sub: sideWhy },
    { k: "HALS", v: tackTxt, sub: tackWhy },
    { k: "BEAT", v: `${m.beatLen.toFixed(0)} m, oś ${m.beatBrg.toFixed(0)}°`, sub: `wiatr średni ${m.wAll.toFixed(0)}° · skos ${m.skew > 0 ? "+" : ""}${m.skew.toFixed(0)}°` },
  ];

  const { pin: sP, rc: sR, mark: sM } = { pin: m.raw.pin.spd, rc: m.raw.rc.spd, mark: m.raw.mark.spd };
  if ([sP, sR, sM].every(Number.isFinite)) {
    const lineAvg = (sP + sR) / 2;
    const dUp = sM - lineAvg;
    const dEnds = sR - sP;
    let v, sub;
    if (Math.abs(dEnds) >= 1.5) {
      v = `więcej wiatru przy ${dEnds > 0 ? "KOMISJI" : "PINIE"} (+${Math.abs(dEnds).toFixed(1)} kn)`;
      sub = `w Optimiście ciśnienie często wygrywa z małym biasem`;
    } else {
      v = "równe ciśnienie na linii";
      sub = `pin ${sP.toFixed(1)} kn · RC ${sR.toFixed(1)} kn`;
    }
    sub += dUp >= 1.5 ? ` · u góry mocniej (+${dUp.toFixed(1)} kn)` : dUp <= -1.5 ? ` · u góry słabiej (${dUp.toFixed(1)} kn)` : "";
    rows.splice(2, 0, { k: "CIŚNIENIE", v, sub });
  }

  return (
    <div style={{ border: `1.5px solid ${C.ink}` }}>
      {rows.map((r, i) => (
        <div key={r.k} style={{ display: "grid", gridTemplateColumns: "84px 1fr", gap: 12, padding: "10px 14px", borderTop: i ? `1px solid ${C.line}` : "none", alignItems: "baseline" }}>
          <span style={{ fontFamily: "'Barlow Condensed', sans-serif", fontWeight: 700, fontSize: 16, letterSpacing: 1, color: C.magenta }}>{r.k}</span>
          <span style={{ fontSize: 14 }}>
            <b>{r.v}</b>
            <span style={{ display: "block", fontSize: 11.5, color: C.inkSoft, marginTop: 2 }}>{r.sub}</span>
          </span>
        </div>
      ))}
    </div>
  );
}

/* ---------- BLE anemometer (Calypso Ultrasonic UP10 / Mini) ---------- */
const MS2KN = 1.9438;
function BleAnemometer({ onSave }) {
  const [status, setStatus] = useState("off"); // off|connecting|on|err
  const [msg, setMsg] = useState("");
  const [live, setLive] = useState(null);      // {relDir, compass, spdKn, batt}
  const [headingMode, setHeadingMode] = useState("sensor"); // sensor | manual
  const [manualHdg, setManualHdg] = useState("");
  const [measuring, setMeasuring] = useState(0); // seconds left
  const [result, setResult] = useState(null);    // {dir, spd, gust, n, mode, sog}
  const [trueWind, setTrueWind] = useState(true); // korekta o ruch łodzi z GPS
  const samplesRef = useRef([]);
  const gpsRef = useRef([]);
  const deviceRef = useRef(null);

  const absDir = (relDir, compass) => {
    const hdg = headingMode === "manual" ? parseNum(manualHdg) : compass;
    if (!Number.isFinite(hdg)) return null;
    return norm360(hdg + relDir);
  };

  const connect = async () => {
    if (!navigator.bluetooth) {
      setStatus("err");
      setMsg("Web Bluetooth niedostępny — użyj Chrome na Androidzie (na iPhone: przeglądarka Bluefy)");
      return;
    }
    try {
      setStatus("connecting"); setMsg("Wybierz urządzenie ULTRASONIC…");
      const device = await navigator.bluetooth.requestDevice({
        filters: [{ namePrefix: "ULTRASONIC" }],
        optionalServices: [0x180d, 0x180a],
      });
      deviceRef.current = device;
      device.addEventListener("gattserverdisconnected", () => { setStatus("off"); setLive(null); setMsg("Rozłączono"); });
      const server = await device.gatt.connect();
      const svc = await server.getPrimaryService(0x180d);
      const ch = await svc.getCharacteristic(0x2a39);
      await ch.startNotifications();
      ch.addEventListener("characteristicvaluechanged", (e) => {
        const dv = e.target.value;
        if (dv.byteLength < 10) return;
        const spdKn = (dv.getUint16(0, true) / 100) * MS2KN;
        const relDir = dv.getUint16(2, true);
        const batt = dv.getUint8(4) * 10;
        const compass = norm360(360 - dv.getUint16(8, true));
        const sample = { relDir, compass, spdKn, batt, t: Date.now() };
        setLive(sample);
        samplesRef.current.push(sample);
        if (samplesRef.current.length > 600) samplesRef.current.shift();
      });
      setStatus("on"); setMsg("Połączono — odczyt 1–4 Hz");
    } catch (e) {
      setStatus("err"); setMsg("Nie udało się połączyć: " + (e?.message || e));
    }
  };

  const disconnect = () => { try { deviceRef.current?.gatt?.disconnect(); } catch {} };

  const measure = (seconds = 30) => {
    samplesRef.current = [];
    gpsRef.current = [];
    setResult(null);
    setMeasuring(seconds);

    let watchId = null;
    if (trueWind && "geolocation" in navigator) {
      watchId = navigator.geolocation.watchPosition(
        (pos) => {
          const { speed, heading } = pos.coords; // m/s, deg COG
          if (Number.isFinite(speed) && Number.isFinite(heading)) {
            gpsRef.current.push({ sogKn: speed * MS2KN, cog: heading });
          }
        },
        () => {},
        { enableHighAccuracy: true, maximumAge: 0 }
      );
    }

    const tick = setInterval(() => setMeasuring((s) => Math.max(0, s - 1)), 1000);
    setTimeout(() => {
      clearInterval(tick);
      if (watchId != null) navigator.geolocation.clearWatch(watchId);
      setMeasuring(0);
      const smp = samplesRef.current.slice();
      const withDir = smp.map((s) => ({ ...s, dir: absDir(s.relDir, s.compass) })).filter((s) => s.dir != null);
      if (withDir.length < 3) {
        setMsg(smp.length ? "Brak kursu odniesienia — ustaw kurs ręcznie lub włącz kompas czujnika" : "Za mało próbek — sprawdź połączenie");
        return;
      }

      // średni wektor wiatru pozornego (ruch powietrza: DOKĄD wieje = dir+180)
      let ax = 0, ay = 0;
      withDir.forEach((s) => {
        const to = (s.dir + 180) * D2R;
        ax += s.spdKn * Math.sin(to);
        ay += s.spdKn * Math.cos(to);
      });
      ax /= withDir.length; ay /= withDir.length;

      // średni wektor ruchu łodzi z GPS
      const gps = gpsRef.current;
      let sog = 0;
      if (trueWind && gps.length >= 2) {
        let bx = 0, by = 0;
        gps.forEach((g) => {
          bx += g.sogKn * Math.sin(g.cog * D2R);
          by += g.sogKn * Math.cos(g.cog * D2R);
        });
        bx /= gps.length; by /= gps.length;
        sog = Math.hypot(bx, by);
        // rzeczywisty ruch powietrza = pozorny + ruch łodzi
        ax += bx; ay += by;
      }

      const spd = Math.hypot(ax, ay);
      const dir = Math.round(norm360(Math.atan2(ax, ay) / D2R + 180)); // z powrotem: SKĄD wieje
      const gust = Math.max(...withDir.map((s) => s.spdKn));
      const mode = trueWind && gps.length >= 2 ? "true" : "apparent";
      setResult({ dir, spd, gust, n: withDir.length, mode, sog });
      setMsg(trueWind && gps.length < 2 ? "Brak danych GPS o ruchu — wynik bez korekty (pozorny)" : "");
    }, seconds * 1000);
  };

  const liveDir = live ? absDir(live.relDir, live.compass) : null;

  return (
    <fieldset style={{ border: `1.5px solid ${C.ink}`, padding: "12px 14px 14px", margin: 0, background: "#F6F2E7" }}>
      <legend style={{ fontFamily: "'Barlow Condensed', sans-serif", fontWeight: 600, fontSize: 17, textTransform: "uppercase", letterSpacing: 0.5, padding: "0 6px" }}>
        Anemometr BLE (Calypso)
      </legend>

      {status !== "on" ? (
        <button onClick={connect} disabled={status === "connecting"}
          style={{ width: "100%", fontFamily: "inherit", fontSize: 13, fontWeight: 600, padding: "9px 10px", border: `1.5px solid ${C.ink}`, background: C.ink, color: "#FBF9F3", cursor: "pointer" }}>
          {status === "connecting" ? "Łączenie…" : "⌁ Połącz z wiatromierzem"}
        </button>
      ) : (
        <>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", fontSize: 13, marginBottom: 8 }}>
            <span>
              <b style={{ fontSize: 18 }}>{liveDir != null ? `${Math.round(liveDir)}°` : `${live?.relDir ?? "—"}° wzgl.`}</b>
              {" · "}<b style={{ fontSize: 18 }}>{live ? live.spdKn.toFixed(1) : "—"}</b> kn
            </span>
            <span style={{ fontSize: 11, color: C.inkSoft }}>bat. {live?.batt ?? "—"}%</span>
          </div>

          <div style={{ display: "flex", gap: 10, fontSize: 11.5, marginBottom: 8, flexWrap: "wrap" }}>
            <label><input type="radio" checked={headingMode === "sensor"} onChange={() => setHeadingMode("sensor")} /> kompas czujnika</label>
            <label><input type="radio" checked={headingMode === "manual"} onChange={() => setHeadingMode("manual")} /> kurs znaczka ręcznie:</label>
            {headingMode === "manual" && (
              <input value={manualHdg} onChange={(e) => setManualHdg(e.target.value)} placeholder="np. 0" inputMode="numeric"
                style={{ width: 64, fontFamily: "inherit", fontSize: 12, padding: "3px 6px", border: `1.5px solid ${C.ink}`, background: "#FBF9F3" }} />
            )}
          </div>

          <label style={{ display: "flex", gap: 6, fontSize: 11.5, marginBottom: 8, alignItems: "center" }}>
            <input type="checkbox" checked={trueWind} onChange={(e) => setTrueWind(e.target.checked)} />
            koryguj o ruch łodzi (GPS) → wiatr rzeczywisty
          </label>

          <button onClick={() => measure(30)} disabled={measuring > 0}
            style={{ width: "100%", fontFamily: "inherit", fontSize: 13, fontWeight: 600, padding: "9px 10px", border: `1.5px solid ${C.magenta}`, background: measuring ? "#E5E0D2" : C.magenta, color: measuring ? C.inkSoft : "#FBF9F3", cursor: "pointer" }}>
            {measuring ? `Pomiar… ${measuring} s` : "Pomiar uśredniony 30 s"}
          </button>

          {result && (
            <div style={{ marginTop: 8, fontSize: 12.5 }}>
              <div style={{ marginBottom: 6 }}>
                {result.mode === "true" ? "Rzeczywisty" : "Pozorny"}: <b>{result.dir}° · {result.spd.toFixed(1)} kn</b>
                <span style={{ color: C.inkSoft }}>
                  {" "}(szkwał {result.gust.toFixed(1)} kn, n={result.n}{result.mode === "true" ? `, SOG ${result.sog.toFixed(1)} kn` : ""})
                </span>
              </div>
              <div style={{ display: "flex", gap: 6 }}>
                {[["rc", "→ RC"], ["pin", "→ PIN"], ["mark", "→ BOJA 1"]].map(([k, lbl]) => (
                  <button key={k} onClick={() => onSave(k, result.dir, result.spd)}
                    style={{ flex: 1, fontFamily: "inherit", fontSize: 12, fontWeight: 600, padding: "7px 4px", border: `1.5px solid ${C.ink}`, background: "transparent", color: C.ink, cursor: "pointer" }}>
                    {lbl}
                  </button>
                ))}
              </div>
            </div>
          )}

          <button onClick={disconnect}
            style={{ marginTop: 8, width: "100%", fontFamily: "inherit", fontSize: 11.5, padding: "6px", border: `1px solid ${C.inkSoft}`, background: "transparent", color: C.inkSoft, cursor: "pointer" }}>
            Rozłącz
          </button>
        </>
      )}

      {msg && <div style={{ marginTop: 8, fontSize: 11, color: status === "err" ? "#A3342C" : C.inkSoft }}>{msg}</div>}
      <div style={{ marginTop: 8, fontSize: 10.5, color: C.inkSoft, lineHeight: 1.5 }}>
        Mierz na zatrzymanej łodzi (dryf zafałszuje wiatr pozorny). Znaczek na obudowie = odniesienie kierunku.
      </div>
    </fieldset>
  );
}

function Chart({ m, tackAngle }) {
  const W = 640, H = 460, PAD = 56;
  const xs = [m.P, m.R, m.M].map((p) => p.x);
  const ys = [m.P, m.R, m.M].map((p) => p.y);
  const minX = Math.min(...xs), maxX = Math.max(...xs);
  const minY = Math.min(...ys), maxY = Math.max(...ys);
  const spanX = Math.max(maxX - minX, 60), spanY = Math.max(maxY - minY, 60);
  const s = Math.min((W - 2 * PAD) / spanX, (H - 2 * PAD) / spanY);
  const cx = (minX + maxX) / 2, cy = (minY + maxY) / 2;
  const sx = (p) => W / 2 + (p.x - cx) * s;
  const sy = (p) => H / 2 - (p.y - cy) * s;

  const P = { x: sx(m.P), y: sy(m.P) };
  const R = { x: sx(m.R), y: sy(m.R) };
  const M = { x: sx(m.M), y: sy(m.M) };

  // ladder rungs perpendicular to mean wind
  const rungDir = (m.wAll + 90) * D2R;
  const windDir = m.wAll * D2R;
  const rungs = [];
  const L = Math.max(W, H);
  for (let i = -4; i <= 6; i++) {
    const ox = W / 2 + Math.sin(windDir) * -i * 52 * -1; // step along upwind axis (screen)
    const oy = H / 2 + Math.cos(windDir) * i * 52;
    rungs.push({
      x1: ox - Math.sin(rungDir) * L, y1: oy + Math.cos(rungDir) * L,
      x2: ox + Math.sin(rungDir) * L, y2: oy - Math.cos(rungDir) * L,
    });
  }

  // laylines from mark: downwind directions wAll+180 ± tackAngle
  const lay = [m.wAll + 180 - tackAngle, m.wAll + 180 + tackAngle].map((b) => ({
    x: M.x + Math.sin(b * D2R) * L, y: M.y - Math.cos(b * D2R) * L,
  }));

  const windArrow = (px, py, deg, color) => {
    const r = deg * D2R;
    const len = 34;
    const tx = px + Math.sin(r) * -len * -1; // arrow points DOWNWIND (from deg)
    const hx = px + Math.sin(r + Math.PI) * len;
    const hy = py - Math.cos(r + Math.PI) * len;
    const tailx = px + Math.sin(r) * 10, taily = py - Math.cos(r) * 10;
    const a1 = r + Math.PI + 2.6, a2 = r + Math.PI - 2.6;
    return (
      <g key={px + "" + py} stroke={color} strokeWidth={2.2} fill="none">
        <line x1={tailx} y1={taily} x2={hx} y2={hy} />
        <line x1={hx} y1={hy} x2={hx + Math.sin(a1) * 9} y2={hy - Math.cos(a1) * 9} />
        <line x1={hx} y1={hy} x2={hx + Math.sin(a2) * 9} y2={hy - Math.cos(a2) * 9} />
      </g>
    );
  };

  const favP = m.favored === "pin", favR = m.favored === "rc";

  return (
    <svg viewBox={`0 0 ${W} ${H}`} role="img" aria-label="Mapa taktyczna trasy"
         style={{ width: "100%", height: "auto", border: `1.5px solid ${C.ink}`, background: `linear-gradient(180deg, ${C.water}, ${C.waterDeep})`, display: "block" }}>
      {/* ladder rungs */}
      <g stroke={C.line} strokeWidth={1} strokeDasharray="2 6" opacity={0.9}>
        {rungs.map((r, i) => <line key={i} {...r} />)}
      </g>

      {/* laylines */}
      <g stroke={C.magenta} strokeWidth={1.4} strokeDasharray="7 5" opacity={0.85}>
        {lay.map((p, i) => <line key={i} x1={M.x} y1={M.y} x2={p.x} y2={p.y} />)}
      </g>

      {/* beat axis */}
      <line x1={(P.x + R.x) / 2} y1={(P.y + R.y) / 2} x2={M.x} y2={M.y} stroke={C.inkSoft} strokeWidth={1} strokeDasharray="1 4" />

      {/* start line */}
      <line x1={P.x} y1={P.y} x2={R.x} y2={R.y} stroke={C.ink} strokeWidth={3} />

      {/* zielona strzałka: rekomendowana strona trasy */}
      {(() => {
        const mid2 = { x: (P.x + R.x) / 2, y: (P.y + R.y) / 2 };
        const vx = M.x - mid2.x, vy = M.y - mid2.y;
        const len = Math.hypot(vx, vy);
        if (len < 40) return null;
        const ux = vx / len, uy = vy / len;
        const rx = -uy, ry = ux; // prawa strona względem kierunku beatu (ekran)
        const sideSign = m.side === "right" ? 1 : m.side === "left" ? -1 : 0;
        const p0 = { x: mid2.x + ux * len * 0.14, y: mid2.y + uy * len * 0.14 };
        const p2 = { x: M.x - ux * len * 0.16, y: M.y - uy * len * 0.16 };
        const bow = sideSign * len * 0.26;
        const p1 = { x: (p0.x + p2.x) / 2 + rx * bow, y: (p0.y + p2.y) / 2 + ry * bow };
        // grot wzdłuż stycznej na końcu
        const tx = p2.x - p1.x, ty = p2.y - p1.y;
        const tl = Math.hypot(tx, ty) || 1;
        const hx = tx / tl, hy = ty / tl;
        const a = 12;
        const label = m.side === "right" ? "PRAWA" : m.side === "left" ? "LEWA" : "ŚRODEK";
        return (
          <g>
            <path d={`M ${p0.x} ${p0.y} Q ${p1.x} ${p1.y} ${p2.x} ${p2.y}`}
                  fill="none" stroke={C.green} strokeWidth={5} strokeLinecap="round" opacity={0.9} />
            <path d={`M ${p2.x} ${p2.y} L ${p2.x - hx * a - hy * a * 0.6} ${p2.y - hy * a + hx * a * 0.6}
                      L ${p2.x - hx * a + hy * a * 0.6} ${p2.y - hy * a - hx * a * 0.6} Z`}
                  fill={C.green} opacity={0.9} />
            <text x={p1.x + rx * sideSign * 14} y={p1.y + ry * sideSign * 14}
                  textAnchor="middle" fontSize="12" fontWeight="700" fill={C.green}
                  fontFamily="'Barlow Condensed', sans-serif" letterSpacing="1">{label}</text>
          </g>
        );
      })()}

      {/* favored end halo */}
      {favP && <circle cx={P.x} cy={P.y} r={16} fill="none" stroke={C.green} strokeWidth={3} />}
      {favR && <circle cx={R.x} cy={R.y} r={16} fill="none" stroke={C.green} strokeWidth={3} />}

      {/* pin */}
      <circle cx={P.x} cy={P.y} r={7} fill={C.magenta} stroke="#fff" strokeWidth={1.5} />
      {/* RC boat */}
      <g transform={`translate(${R.x},${R.y})`}>
        <path d="M -9 6 L 9 6 L 6 -7 L -6 -7 Z" fill={C.ink} stroke="#fff" strokeWidth={1.2} />
      </g>
      {/* mark 1 */}
      <circle cx={M.x} cy={M.y} r={8} fill={C.orange} stroke="#fff" strokeWidth={1.5} />

      {/* wind arrows */}
      {windArrow(P.x - 0, P.y + 0, m.raw.pin.wind, C.magenta)}
      {windArrow(R.x, R.y, m.raw.rc.wind, C.ink)}
      {windArrow(M.x, M.y, m.raw.mark.wind, C.orange)}

      {/* labels */}
      <g fontFamily="'IBM Plex Mono', monospace" fontSize="11.5" fill={C.ink}>
        <text x={P.x + 12} y={P.y + 18}>PIN · {m.raw.pin.wind.toFixed(0)}°{Number.isFinite(m.raw.pin.spd) ? ` ${m.raw.pin.spd.toFixed(0)}kn` : ""}{favP ? " ★" : ""}</text>
        <text x={R.x + 12} y={R.y + 18}>RC · {m.raw.rc.wind.toFixed(0)}°{Number.isFinite(m.raw.rc.spd) ? ` ${m.raw.rc.spd.toFixed(0)}kn` : ""}{favR ? " ★" : ""}</text>
        <text x={M.x + 14} y={M.y - 10}>BOJA 1 · {m.raw.mark.wind.toFixed(0)}°{Number.isFinite(m.raw.mark.spd) ? ` ${m.raw.mark.spd.toFixed(0)}kn` : ""}</text>
      </g>

      {/* north arrow + scale */}
      <g transform={`translate(${W - 34}, 40)`} stroke={C.ink} fill={C.ink}>
        <line x1={0} y1={14} x2={0} y2={-14} strokeWidth={1.6} />
        <path d="M 0 -14 L -5 -4 L 5 -4 Z" />
        <text x={0} y={30} textAnchor="middle" fontSize="11" fontFamily="'IBM Plex Mono', monospace" stroke="none">N</text>
      </g>
      <g transform={`translate(24, ${H - 22})`}>
        <line x1={0} y1={0} x2={100 * s} y2={0} stroke={C.ink} strokeWidth={2} />
        <text x={100 * s / 2} y={-6} textAnchor="middle" fontSize="10.5" fill={C.ink} fontFamily="'IBM Plex Mono', monospace">100 m</text>
      </g>
    </svg>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<TaktykaRegatowa />);
</script>
